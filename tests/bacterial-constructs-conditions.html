<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bacterial Constructs conditional controls</title>
  <link rel="stylesheet" href="../helper/uiHelper.css">
  <style>body { background: #171717; color: #eee; overflow: auto; padding: 12px; } pre { white-space: pre-wrap; }</style>
</head>
<body>
  <script type="module">
    import { runBacterialConstructsConditionChecks } from './bacterial-constructs-conditions.js';
    const output = document.createElement('pre');
    try {
      const passed = await runBacterialConstructsConditionChecks();
      output.textContent = `${passed.length} checks passed.\n\n${passed.join('\n')}`;
      document.body.dataset.testStatus = 'passed';
    } catch (error) {
      output.textContent = error.stack;
      document.body.dataset.testStatus = 'failed';
      console.error(error);
    }
    document.body.append(output);
  </script>
</body>
</html>
