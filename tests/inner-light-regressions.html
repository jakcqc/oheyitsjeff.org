<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inner Light regression checks</title>
  <style>
    body { background: #171717; color: #eee; font: 14px system-ui, sans-serif; }
    #results { white-space: pre-wrap; }
    iframe { border: 1px solid #555; }
  </style>
</head>
<body>
  <pre id="results">Running Inner Light regression checks…</pre>
  <script type="module">
    import { runInnerLightRegressions } from './inner-light-regressions.js';
    const output = document.getElementById('results');
    try {
      const passed = await runInnerLightRegressions();
      output.textContent = `${passed.length} checks passed.\n\n${passed.join('\n')}`;
      document.body.dataset.testStatus = 'passed';
    } catch (error) {
      output.textContent = error.stack;
      document.body.dataset.testStatus = 'failed';
      console.error(error);
    }
  </script>
</body>
</html>
