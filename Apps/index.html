<html lang="en">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the theme before styles or deferred gallery code can paint.
    (() => {
      let saved;
      try { saved = localStorage.getItem('home.theme'); } catch {}
      const theme = saved === 'dark' || saved === 'light'
        ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <meta name="description" content="Explore saved SVG studies and reopen their visual simulations, or browse all oheyitsjeff apps.">
